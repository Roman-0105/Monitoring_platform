let running = false;
let cntOk = 0, cntErr = 0;

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function updateStats() {
  document.getElementById('sOk').textContent    = cntOk;
  document.getElementById('sErr').textContent   = cntErr;
  document.getElementById('sTotal').textContent = POINTS.length;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function fetchDrivePhoto(fileId) {
  // Пробуем несколько форматов URL
  const urls = [
    `https://drive.google.com/uc?export=download&id=${fileId}&confirm=t`,
    `https://drive.usercontent.google.com/download?id=${fileId}&export=download&authuser=0&confirm=t`,
  ];
  for (const url of urls) {
    try {
      const res = await fetch(url, { credentials: 'include' });
      if (!res.ok) continue;
      const ct = res.headers.get('content-type') || 'image/jpeg';
      if (ct.includes('text/html')) continue;
      const blob = await res.blob();
      return { blob, mime: ct.split(';')[0].trim() };
    } catch { continue; }
  }
  throw new Error('Не удалось скачать с Drive (проверьте доступ к файлу)');
}

async function startMigration() {
  const key = document.getElementById('serviceKey').value.trim();
  const url = document.getElementById('supabaseUrl').value.trim();
  if (!key || !url) { alert('Заполните Service Key и URL'); return; }

  const { createClient } = supabase;
  const sb = createClient(url, key);

  // Проверка подключения
  const { error: testErr } = await sb.from('points').select('id').limit(1);
  if (testErr) { log('❌ Ошибка подключения к Supabase: ' + testErr.message, 'err'); return; }

  running = true;
  cntOk = 0; cntErr = 0;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled  = false;
  document.getElementById('log').innerHTML = '';
  updateStats();

  log('Подключение к Supabase: ✅', 'ok');
  log('Начинаем миграцию ' + POINTS.length + ' фотографий...\n', 'info');

  for (let i = 0; i < POINTS.length; i++) {
    if (!running) { log('\n⏹ Остановлено пользователем', 'info'); break; }

    const [pointId, fileId] = POINTS[i];
    const prefix = `[${i+1}/${POINTS.length}] ${pointId.slice(-8)}: `;

    try {
      // Скачиваем с Drive
      const { blob, mime } = await fetchDrivePhoto(fileId);
      const ext  = mime.split('/')[1]?.replace('jpeg','jpg') || 'jpg';
      const storagePath = `${pointId}/${Date.now()}.${ext}`;

      // Загружаем в Storage
      const { error: upErr } = await sb.storage
        .from('photos').upload(storagePath, blob, { contentType: mime, upsert: false });
      if (upErr) throw new Error('Storage: ' + upErr.message);

      // Получаем публичный URL
      const { data: urlData } = sb.storage.from('photos').getPublicUrl(storagePath);
      const publicUrl = urlData.publicUrl;

      // Обновляем запись в БД
      const { data: row } = await sb.from('points').select('photos').eq('id', pointId).maybeSingle();
      const existing = (row && row.photos) || [];
      if (!existing.includes(publicUrl)) {
        const { error: dbErr } = await sb.from('points')
          .update({ photos: [publicUrl, ...existing] }).eq('id', pointId);
        if (dbErr) throw new Error('DB: ' + dbErr.message);
      }

      log(prefix + '✅ загружено', 'ok');
      cntOk++;
    } catch (err) {
      log(prefix + '❌ ' + err.message, 'err');
      cntErr++;
    }

    updateStats();
    if (i < POINTS.length - 1) await sleep(300);
  }

  log('\n══════════════════════════════', 'info');
  log(`✅ Успешно: ${cntOk}   ❌ Ошибок: ${cntErr}`, cntErr > 0 ? 'err' : 'ok');

  running = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled  = true;
}

function stopMigration() {
  running = false;
}
