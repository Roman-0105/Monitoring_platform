<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Идеи стилей меток карты</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; font-weight: 700; color: #e6edf3; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #8b949e; margin-bottom: 32px; }
  .section { margin-bottom: 48px; }
  .section-title {
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: #58a6ff; margin-bottom: 16px;
    padding-bottom: 8px; border-bottom: 1px solid #21262d;
  }
  .ideas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .idea-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .idea-card:hover { border-color: #58a6ff; transform: translateY(-2px); }
  .idea-card.selected { border-color: #3fb950; box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
  .card-header {
    padding: 14px 16px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .card-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 20px;
  }
  .badge-new  { background: rgba(88,166,255,.15); color: #58a6ff; }
  .badge-rec  { background: rgba(63,185,80,.15);  color: #3fb950; }
  .badge-bold { background: rgba(249,171,0,.15);  color: #f9ab00; }
  .card-title { font-size: 14px; font-weight: 700; color: #e6edf3; }
  .card-desc  { font-size: 12px; color: #8b949e; padding: 0 16px 14px; line-height: 1.5; }
  canvas { display: block; width: 100%; height: 180px; }

  /* Legend ideas section */
  .legend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .legend-preview {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .legend-preview:hover { border-color: #58a6ff; }
  .legend-preview.selected { border-color: #3fb950; }
  .legend-label { font-size: 12px; font-weight: 700; color: #e6edf3; margin-bottom: 12px; }

  /* Legend style A – dots */
  .leg-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; color: #c9d1d9; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Legend style B – pill */
  .leg-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 6px; border-radius: 20px;
    font-size: 11px; font-weight: 600; margin: 3px 3px 3px 0;
  }
  .leg-pill .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Legend style C – swatch row */
  .swatch-row { display: flex; height: 28px; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .swatch { flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: 9px; font-weight: 700; color: rgba(255,255,255,.85); letter-spacing: .03em; }

  /* Legend style D – card with icon */
  .leg-card-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .leg-card {
    flex: 1; border-radius: 8px; padding: 6px 8px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
  }
  .leg-card-num { font-size: 16px; line-height: 1; }
  .leg-card-info { flex: 1; }
  .leg-card-name { font-size: 10px; font-weight: 700; }
  .leg-card-sub  { font-size: 9px; color: #8b949e; }

  .choose-btn {
    display: block; width: calc(100% - 32px); margin: 0 16px 16px;
    padding: 8px; border-radius: 8px; border: 1px solid #30363d;
    background: transparent; color: #8b949e; font-size: 12px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .choose-btn:hover { background: rgba(88,166,255,.1); color: #58a6ff; border-color: #58a6ff; }
  .choose-btn.chosen { background: rgba(63,185,80,.1); color: #3fb950; border-color: #3fb950; }

  .combo-row { display: flex; gap: 12px; align-items: flex-start; }
  .combo-label { font-size: 11px; color: #8b949e; margin-top: 6px; min-width: 100px; }

  .note { font-size: 11px; color: #8b949e; margin-top: 24px; padding: 12px 16px; background: rgba(249,171,0,.05); border: 1px solid rgba(249,171,0,.15); border-radius: 8px; }
</style>
</head>
<body>

<h1>Идеи стилей меток карты</h1>
<p class="subtitle">Кликни на вариант, чтобы выбрать. Потом скажи — внедрим.</p>

<div class="section">
  <div class="section-title">Маркеры точек мониторинга</div>
  <div class="ideas-grid" id="marker-grid"></div>
</div>

<div class="section">
  <div class="section-title">Маркеры канав</div>
  <div class="ideas-grid" id="ditch-grid"></div>
</div>

<div class="section">
  <div class="section-title">Легенда / условные обозначения</div>
  <div class="legend-grid" id="legend-grid"></div>
</div>

<div class="note">
  💡 Можно комбинировать: любой стиль маркера точек + любой стиль маркера канав + любой стиль легенды.<br>
  Напиши что понравилось — и внедрим.
</div>

<script>
// ── Палитра ──────────────────────────────────────────────────
var STATUS = {
  'Новая':      '#1a73e8',
  'Активная':   '#34a853',
  'Иссякает':   '#f9ab00',
  'Пересохла':  '#ea4335',
  'Паводковая': '#7c3aed',
  'Перелив':    '#0891b2',
};
var INTENSITIES = ['Слабая', 'Умеренная', 'Сильная', 'Очень сильная'];
var STATUS_KEYS = Object.keys(STATUS);

// sample points for preview
var SAMPLE_POINTS = [
  { num: '3',  status: 'Активная',   intensity: 'Умеренная',     x: 60,  y: 80  },
  { num: '7',  status: 'Иссякает',   intensity: 'Слабая',        x: 130, y: 50  },
  { num: '12', status: 'Пересохла',  intensity: 'Умеренная',     x: 200, y: 100 },
  { num: '1',  status: 'Новая',      intensity: 'Сильная',       x: 280, y: 60  },
  { num: '9',  status: 'Паводковая', intensity: 'Очень сильная', x: 350, y: 90  },
  { num: '5',  status: 'Активная',   intensity: 'Слабая',        x: 90,  y: 130 },
  { num: '14', status: 'Иссякает',   intensity: 'Очень сильная', x: 240, y: 140 },
];

var INT_SIZES = { 'Слабая': 7, 'Умеренная': 11, 'Сильная': 15, 'Очень сильная': 20 };
function ic(s) { return STATUS[s] || '#888'; }
function ir(p) { return INT_SIZES[p.intensity] || 10; }

// ── Draw helpers ─────────────────────────────────────────────
function setupCanvas(canvas) {
  var dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);
  return ctx;
}

function grid(ctx, w, h) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  ctx.lineWidth = 1;
  for (var x = 0; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (var y = 0; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.restore();
}

// ── MARKER STYLES ─────────────────────────────────────────────

// A: Текущий стиль (кружок + badge)
function drawStyleA(ctx, p) {
  var r = ir(p);
  var x = p.x, y = p.y;
  var col = ic(p.status);
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = '#ff8c00'; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8; ctx.stroke();
  // badge
  var br = Math.max(3, r * 0.45);
  ctx.beginPath(); ctx.arc(x + r*0.55, y - r*0.55, br, 0, Math.PI*2);
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  // label
  if (r >= 9) {
    ctx.fillStyle = '#0b0f14'; ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(p.num, x+r/3, y-r-2);
    ctx.fillStyle = '#fff'; ctx.fillText(p.num, x, y-r-3);
  }
}

// B: Кружок с цветным кольцом (статус = кольцо, размер = интенсивность)
function drawStyleB(ctx, p) {
  var r = ir(p);
  var x = p.x, y = p.y;
  var col = ic(p.status);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
  // inner fill — тёмная
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(20,26,36,0.92)'; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  // colored ring
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
  // number
  ctx.fillStyle = col;
  ctx.font = 'bold ' + Math.round(r * 0.9) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.num, x, y + 0.5);
}

// C: Pin / каплевидный маркер
function drawStyleC(ctx, p) {
  var r = ir(p) * 1.1;
  var x = p.x, y = p.y;
  var col = ic(p.status);
  var h = r * 2.2;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(x, y - h*0.4, r, Math.PI*0.85, Math.PI*0.15, false);
  ctx.quadraticCurveTo(x + r*0.5, y + h*0.1, x, y + h*0.6);
  ctx.quadraticCurveTo(x - r*0.5, y + h*0.1, x - r, y - h*0.4 + r * Math.sin(Math.PI*0.85));
  ctx.closePath();
  var grd = ctx.createLinearGradient(x-r, y-h, x+r, y);
  grd.addColorStop(0, col);
  grd.addColorStop(1, shadeColor(col, -30));
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  // white circle inside
  ctx.beginPath(); ctx.arc(x, y - h*0.4, r*0.58, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
  // number
  ctx.fillStyle = col;
  ctx.font = 'bold ' + Math.round(r * 0.72) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.num, x, y - h*0.4 + 0.5);
}

// D: Hexagon (шестигранник)
function drawStyleD(ctx, p) {
  var r = ir(p) * 1.15;
  var x = p.x, y = p.y;
  var col = ic(p.status);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 7;
  ctx.beginPath();
  for (var i = 0; i < 6; i++) {
    var angle = (Math.PI / 3) * i - Math.PI/6;
    var px = x + r * Math.cos(angle), py = y + r * Math.sin(angle);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  var grd = ctx.createLinearGradient(x-r, y-r, x+r, y+r);
  grd.addColorStop(0, col + 'ee'); grd.addColorStop(1, col + '99');
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
  // intensity ring inside
  var iSizes = { 'Слабая': 0.35, 'Умеренная': 0.5, 'Сильная': 0.65, 'Очень сильная': 0.8 };
  var ir2 = r * (iSizes[p.intensity] || 0.5);
  ctx.beginPath(); ctx.arc(x, y, ir2, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  // number
  ctx.fillStyle = '#fff';
  ctx.font = '700 ' + Math.round(r * 0.7) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.num, x, y + 0.5);
}

// E: Split circle (половина — статус, половина — интенсивность)
function drawStyleE(ctx, p) {
  var r = ir(p);
  var x = p.x, y = p.y;
  var col = ic(p.status);
  var intColors = { 'Слабая': '#4ade80', 'Умеренная': '#facc15', 'Сильная': '#fb923c', 'Очень сильная': '#ef4444' };
  var intCol = intColors[p.intensity] || '#ccc';
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 7;
  // left half = status
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.arc(x, y, r, -Math.PI/2, Math.PI/2, true);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  // right half = intensity
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.arc(x, y, r, -Math.PI/2, Math.PI/2, false);
  ctx.closePath();
  ctx.fillStyle = intCol; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  // border
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.8; ctx.stroke();
  // divider line
  ctx.beginPath(); ctx.moveTo(x, y-r); ctx.lineTo(x, y+r);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  // number
  ctx.fillStyle = '#fff';
  ctx.font = '800 ' + Math.round(r * 0.75) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 3;
  ctx.fillText(p.num, x, y + 0.5);
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
}

// F: Минималистичный (flat no-shadow, тонкий контур)
function drawStyleF(ctx, p) {
  var r = ir(p);
  var x = p.x, y = p.y;
  var col = ic(p.status);
  // outer ring
  ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI*2);
  ctx.fillStyle = col + '33'; ctx.fill();
  // main circle
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  // number
  ctx.fillStyle = '#fff';
  ctx.font = '700 ' + Math.round(r * 0.85) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(p.num, x, y + 0.5);
}

// ── DITCH STYLES ─────────────────────────────────────────────

var DITCH_SAMPLES = [
  { name: 'K-1', status: 'Активная',  x: 60,  y: 80  },
  { name: 'K-3', status: 'Иссякает',  x: 170, y: 50  },
  { name: 'K-7', status: 'Пересохла', x: 280, y: 100 },
  { name: 'K-2', status: 'Новая',     x: 370, y: 55  },
];
var DITCH_COLORS = { 'Активная':'#4090e8','Новая':'#40b8ff','Иссякает':'#f9ab00','Пересохла':'#ea4335','Заилилась':'#8060c0' };

// DA: Текущий стиль (квадрат с ≈)
function drawDitchA(ctx, d) {
  var sz = 14, x = d.x, y = d.y, col = DITCH_COLORS[d.status]||'#4090e8';
  var r = sz * 0.28;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 6;
  roundRect(ctx, x-sz, y-sz, sz*2, sz*2, r);
  var grd = ctx.createLinearGradient(x-sz,y-sz,x+sz,y+sz);
  grd.addColorStop(0, col); grd.addColorStop(1, col+'bb');
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold ' + Math.round(sz*0.95) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('≈', x, y+0.5);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.font = '600 10px sans-serif'; ctx.textBaseline = 'bottom';
  ctx.fillText(d.name, x+1, y-sz-2);
  ctx.fillStyle = '#fff'; ctx.fillText(d.name, x, y-sz-3);
}

// DB: Ромб (diamond)
function drawDitchB(ctx, d) {
  var sz = 14, x = d.x, y = d.y, col = DITCH_COLORS[d.status]||'#4090e8';
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(x, y-sz*1.3); ctx.lineTo(x+sz, y); ctx.lineTo(x, y+sz*1.3); ctx.lineTo(x-sz, y); ctx.closePath();
  var grd = ctx.createLinearGradient(x, y-sz, x, y+sz);
  grd.addColorStop(0, col); grd.addColorStop(1, shadeColor(col,-20));
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke();
  // inner icon
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold ' + Math.round(sz*0.8) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('~', x, y);
  ctx.fillStyle = '#fff'; ctx.font = '600 9px sans-serif'; ctx.textBaseline = 'bottom';
  ctx.fillText(d.name, x, y-sz*1.4);
}

// DC: Треугольник (вниз)
function drawDitchC(ctx, d) {
  var sz = 15, x = d.x, y = d.y, col = DITCH_COLORS[d.status]||'#4090e8';
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(x, y+sz); ctx.lineTo(x-sz, y-sz*0.7); ctx.lineTo(x+sz, y-sz*0.7); ctx.closePath();
  var grd = ctx.createLinearGradient(x, y-sz, x, y+sz);
  grd.addColorStop(0, col+'ee'); grd.addColorStop(1, shadeColor(col,-25));
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = 'bold ' + Math.round(sz*0.8) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▽', x, y-sz*0.1);
  ctx.fillStyle = '#fff'; ctx.font = '600 9px sans-serif'; ctx.textBaseline = 'bottom';
  ctx.fillText(d.name, x, y-sz*0.8);
}

// DD: Pill-маркер с иконкой волны и названием
function drawDitchD(ctx, d) {
  var x = d.x, y = d.y, col = DITCH_COLORS[d.status]||'#4090e8';
  var w = 46, h = 22, r2 = h/2;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
  // pill shape
  ctx.beginPath();
  ctx.moveTo(x-w/2+r2, y-h/2);
  ctx.lineTo(x+w/2-r2, y-h/2);
  ctx.arc(x+w/2-r2, y, r2, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x-w/2+r2, y+h/2);
  ctx.arc(x-w/2+r2, y, r2, Math.PI/2, -Math.PI/2);
  ctx.closePath();
  var grd = ctx.createLinearGradient(x-w/2, y-h/2, x+w/2, y+h/2);
  grd.addColorStop(0, col); grd.addColorStop(1, shadeColor(col,-20));
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.2; ctx.stroke();
  // icon left
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('≈', x - w/2 + r2, y);
  // divider
  ctx.beginPath(); ctx.moveTo(x-w/2+r2*1.8, y-h/2+4); ctx.lineTo(x-w/2+r2*1.8, y+h/2-4);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
  // name right
  ctx.fillStyle = '#fff';
  ctx.font = '700 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(d.name, x + w/2 - r2*1.1, y);
}

// DE: Минималистичный треугольник (маленький, без подписи в маркере)
function drawDitchE(ctx, d) {
  var sz = 10, x = d.x, y = d.y, col = DITCH_COLORS[d.status]||'#4090e8';
  // outer glow
  ctx.beginPath(); ctx.arc(x, y, sz+4, 0, Math.PI*2);
  ctx.fillStyle = col + '22'; ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 6;
  // filled circle
  ctx.beginPath(); ctx.arc(x, y, sz, 0, Math.PI*2);
  ctx.fillStyle = col; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  // wave lines
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
  [-2.5, 0, 2.5].forEach(function(dy) {
    ctx.beginPath(); ctx.moveTo(x-4, y+dy); ctx.bezierCurveTo(x-1.5,y+dy-1.5, x+1.5,y+dy+1.5, x+4,y+dy); ctx.stroke();
  });
  ctx.fillStyle = '#fff'; ctx.font = '600 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(d.name, x, y-sz-3);
}

// ── Helpers ──────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function shadeColor(col, pct) {
  var n = parseInt(col.slice(1), 16);
  var r = Math.max(0, Math.min(255, (n>>16) + pct));
  var g = Math.max(0, Math.min(255, ((n>>8)&0xff) + pct));
  var b = Math.max(0, Math.min(255, (n&0xff) + pct));
  return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

    btn.classList.add('chosen');
  });
  container.appendChild(btn);
}
